<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OptiPress - Modern Image Compressor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>OptiPress</h1>
      <p>Lightning-fast, private image compression right in your browser</p>
    </header>

    <div class="card">
      <div class="drop-zone" id="drop-zone">
        <svg viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <p><strong>Click to browse</strong> or drag & drop image here</p>
        <span>Supports JPG, PNG, WebP, GIF, SVG</span>
        <input type="file" id="file-input" accept="image/*" />
      </div>

      <div class="controls" id="controls" style="display: none;">
        <div class="control-group">
          <label>Quality: <span class="range-val" id="quality-val">75%</span></label>
          <input type="range" id="quality" min="10" max="100" value="75" />
        </div>

        <div class="control-group">
          <label>Output Format</label>
          <select id="format">
            <option value="image/jpeg">JPEG (.jpg)</option>
            <option value="image/webp">WebP (.webp)</option>
            <option value="image/png">PNG (.png)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Max Width</label>
          <select id="max-width">
            <option value="original">Keep Original</option>
            <option value="1920">1920px (Full HD)</option>
            <option value="1280">1280px (HD)</option>
            <option value="800">800px (Web)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card results" id="results-card">
      <div class="comparison">
        <div class="preview-box">
          <h3>Original Image</h3>
          <div class="img-wrap">
            <img id="orig-img" alt="Original preview" />
          </div>
          <div class="meta-badge" id="orig-size">Size: -</div>
        </div>

        <div class="preview-box">
          <h3>Compressed</h3>
          <div class="img-wrap">
            <img id="comp-img" alt="Compressed preview" />
          </div>
          <div style="display: flex; gap: 8px;">
            <div class="meta-badge" id="comp-size">Size: -</div>
            <div class="meta-badge saved-badge" id="saved-pct">0% Saved</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="reset-btn">Upload Another</button>
        <a class="btn btn-primary" id="download-btn" download="compressed.jpg">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z"/>
            <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z"/>
          </svg>
          Download Image
        </a>
      </div>
    </div>

    <footer>
      100% Client-side. Your photos never leave your device.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
